apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bw-pvc
spec:
  storageClassName: rook-ceph-block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bw-dep
  labels:
    k8s-app: bw
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: bw
  template:
    metadata:
      labels:
        k8s-app: bw
    spec:
      containers:
        - name: bw
          image: ubuntu
          imagePullPolicy: IfNotPresent
          env:
            - name: DEBIAN_FRONTEND
              value: noninteractive
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: 8Gi
              cpu: 2
            requests:
              memory: 4Gi
              cpu: 1
          volumeMounts:
            - name: bw-vol
              mountPath: /data
          command: ["bash", "-lc"]
          args:
            - |
              set -euxo pipefail

              # Install system dependencies
              apt-get update
              apt-get install -y --no-install-recommends \
                vim python3 python3-pip python3-venv ca-certificates curl git \
                build-essential libffi-dev libssl-dev
              rm -rf /var/lib/apt/lists/*

              # Create Python virtual environment
              python3 -m venv /opt/venv
              source /opt/venv/bin/activate

              # Install NRP K8s System dependencies
              /opt/venv/bin/pip install --no-cache-dir \
                gradio>=5.0.0 \
                langchain-openai>=0.1.0 \
                openai>=1.0.0 \
                python-dotenv>=1.0.0 \
                kubernetes>=20.0.0 \
                requests>=2.28.0 \
                beautifulsoup4>=4.11.0 \
                tldextract>=3.4.0 \
                pydantic>=2.0.0 \
                urllib3>=1.26.0 \
                langgraph>=0.1.0 \
                typing-extensions>=4.5.0 \
                numpy>=1.21.0 \
                scikit-learn>=1.1.0 \
                tabulate>=0.9.0

              # Create directories
              mkdir -p /app /data /mcp

              # Download and setup MCP System from MCP branch
              cd /
              git clone -b MCP https://gitlab.nrp-nautilus.io/mreddy10/breakwater.git /tmp/breakwater || true
              if [ -d "/tmp/breakwater/mcp" ]; then
                cp -r /tmp/breakwater/mcp/* /mcp/
              fi

              # Create simple Gradio UI for MCP system
              cat > /app/gradio_ui.py << 'EOF'
              #!/usr/bin/env python3
              import gradio as gr
              import subprocess
              import sys
              import os
              from pathlib import Path

              # Add the mcp to Python path
              sys.path.append('/mcp')

              def process_mcp_query(query):
                  if not query.strip():
                      return "❌ Please enter a query!"

                  # Create a wrapper script that returns results (not just prints)
                  wrapper_code = f'''
import asyncio
import sys
import os
sys.path.append('/mcp')

from dotenv import load_dotenv
from openai import AsyncOpenAI

class FixedInteractiveNRPSession:
    def __init__(self):
        load_dotenv()
        self.glm_client = AsyncOpenAI(
            api_key=os.getenv("NRP_API_KEY"),
            base_url=os.getenv("NRP_BASE_URL")
        )

    async def classify_intent(self, user_input):
        try:
            classification_prompt = f"""Analyze this user input and classify the intent:
QUESTION: User wants information/explanation about NRP/Kubernetes
COMMAND: User wants to perform Kubernetes operations
QUIT: User wants to exit

User input: "{{user_input}}"
Respond with ONLY: QUESTION, COMMAND, or QUIT"""

            response = await self.glm_client.chat.completions.create(
                model=os.getenv("NRP_MODEL", "glm-v"),
                messages=[
                    {{"role": "system", "content": "You are an intent classifier. Respond with only: QUESTION, COMMAND, or QUIT."}},
                    {{"role": "user", "content": classification_prompt}}
                ],
                temperature=0.1,
                max_tokens=10
            )
            intent = response.choices[0].message.content.strip().upper()

            if intent not in ['QUESTION', 'COMMAND', 'QUIT']:
                user_lower = user_input.lower()
                if any(word in user_lower for word in ['quit', 'exit', 'stop']):
                    return 'QUIT'
                elif any(word in user_lower for word in ['list', 'get', 'describe', 'kubectl']):
                    return 'COMMAND'
                else:
                    return 'QUESTION'
            return intent
        except Exception as e:
            # Fallback classification
            user_lower = user_input.lower()
            if any(word in user_lower for word in ['quit', 'exit', 'stop']):
                return 'QUIT'
            elif any(word in user_lower for word in ['list', 'get', 'describe', 'kubectl']):
                return 'COMMAND'
            else:
                return 'QUESTION'

    async def ask_question(self, question):
        try:
            explanation_prompt = f"""You are an expert NRP Nautilus specialist.
Provide a comprehensive explanation for: "{{question}}"

Include:
1. Clear explanation
2. Step-by-step instructions
3. Code examples
4. Best practices
5. Troubleshooting tips"""

            response = await self.glm_client.chat.completions.create(
                model=os.getenv("NRP_MODEL", "glm-v"),
                messages=[
                    {{"role": "system", "content": "You are an expert NRP Nautilus Kubernetes specialist."}},
                    {{"role": "user", "content": explanation_prompt}}
                ],
                temperature=0.7,
                max_tokens=2000
            )
            return f"# NRP Documentation Response\\n\\n**Query**: {{question}}\\n\\n{{response.choices[0].message.content}}"
        except Exception as e:
            return f"Error processing question: {{str(e)}}"

    async def process_k8s_command(self, user_input):
        try:
            from fastmcp import Client
            async with Client("http://localhost:8024/mcp") as client:
                result = await client.call_tool("intelligent_k8s_query", {{
                    "params": {{"query": user_input, "context": "K8s command execution"}}
                }})
                return result.data
        except Exception as e:
            return f"K8s command processing note: {{str(e)}}\\n\\nThis will work in deployment when MCP server runs properly."

async def process_single_query():
    session = FixedInteractiveNRPSession()
    user_input = "{query}"

    # Classify intent
    intent = await session.classify_intent(user_input)
    print(f"Intent: {{intent}}")

    if intent == "COMMAND":
        result = await session.process_k8s_command(user_input)
        print(result)
    elif intent == "QUESTION":
        result = await session.ask_question(user_input)
        print(result)
    else:
        print("Session would exit in interactive mode")

if __name__ == "__main__":
    asyncio.run(process_single_query())
'''

                  # Write wrapper to temp file
                  with open('/tmp/mcp_wrapper.py', 'w') as f:
                      f.write(wrapper_code)

                  try:
                      result = subprocess.run([
                          '/opt/venv/bin/python', '/tmp/mcp_wrapper.py'
                      ],
                      capture_output=True,
                      text=True,
                      timeout=30,
                      cwd='/mcp'
                      )

                      if result.returncode == 0:
                          output = result.stdout.strip()
                          if result.stderr:
                              output += f"\n\n⚠️ Warnings:\n{result.stderr}"
                          return f"✅ **Success!**\n\n```\n{output}\n```"
                      else:
                          error_msg = result.stderr or "Unknown error occurred"
                          return f"❌ **Error (Exit code: {result.returncode})**\n\n```\n{error_msg}\n```"

                  except subprocess.TimeoutExpired:
                      return "⏰ **Timeout**: Query took too long (>30 seconds)"
                  except FileNotFoundError:
                      return "❌ **MCP System Not Found**: Make sure the your_interactive_session.py is available"
                  except Exception as e:
                      return f"❌ **Unexpected Error**: {str(e)}"

              # Create the Gradio interface
              with gr.Blocks(
                  title="NRP K8s System - MCP Interface",
                  theme=gr.themes.Soft()
              ) as demo:

                  gr.HTML("""
                  <div style="text-align: center; padding: 20px;">
                      <h1>🚀 NRP K8s System - MCP Interface</h1>
                      <p>Intelligent routing system combining NRP LLM with Kubernetes operations</p>
                  </div>
                  """)

                  with gr.Row():
                      with gr.Column(scale=2):
                          query_input = gr.Textbox(
                              label="Enter your command or query",
                              placeholder="Examples:\n• List my pods\n• How do I request GPUs?\n• Show me my deployments\n• What is a persistent volume?",
                              lines=3,
                              max_lines=5
                          )

                          with gr.Row():
                              submit_btn = gr.Button("🔍 Submit Query", variant="primary", size="lg")
                              clear_btn = gr.Button("🗑️ Clear", size="lg")

                      with gr.Column(scale=1):
                          gr.HTML("<h3>Quick Examples:</h3>")
                          examples = [
                              "list my pods",
                              "How do I request GPUs?",
                              "show deployments in gsoc namespace",
                              "What is a service mesh?",
                              "describe pod status",
                              "How do I create a persistent volume?"
                          ]

                          for example in examples:
                              btn = gr.Button(f"💡 {example}", size="sm")
                              btn.click(lambda x=example: x, outputs=query_input)

                  output_display = gr.Markdown(
                      label="Output",
                      value="**Ready!** Enter a query above to test the MCP system.",
                      height=400
                  )

                  submit_btn.click(process_mcp_query, inputs=query_input, outputs=output_display)
                  clear_btn.click(lambda: ("", "**Cleared!** Enter a new query to test the MCP system."), outputs=[query_input, output_display])
                  query_input.submit(process_mcp_query, inputs=query_input, outputs=output_display)

              if __name__ == "__main__":
                  print("🚀 Starting NRP K8s System MCP Interface...")
                  demo.launch(server_name="0.0.0.0", server_port=80, share=False, show_error=True)
              EOF

              # Set up environment variables
              echo "mounted $(date -Iseconds)" > /data/.mounted
              export PYTHONUNBUFFERED=1
              export PYTHONPATH="/mcp:$PYTHONPATH"

              # Start the Gradio application
              echo "Starting NRP K8s System MCP Interface with Gradio..."
              echo "Gradio version: $(/opt/venv/bin/python -c 'import gradio;print(gradio.__version__)')"
              echo "Available at: http://bw.nrp-nautilus.io"

              exec /opt/venv/bin/python /app/gradio_ui.py
      volumes:
        - name: bw-vol
          persistentVolumeClaim:
            claimName: bw-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: bw-svc
  labels:
    k8s-app: bw-svc
spec:
  selector:
    k8s-app: bw
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bw-ingress
spec:
  ingressClassName: haproxy
  rules:
    - host: bw.nrp-nautilus.io
      http:
        paths:
          - backend:
              service:
                name: bw-svc
                port:
                  number: 80
            path: /
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - bw.nrp-nautilus.io

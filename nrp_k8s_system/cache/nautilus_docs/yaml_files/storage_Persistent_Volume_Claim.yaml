# Persistent Volume Claim
# Source: https://nrp-nautilus.io/docs/storage/
# Description: PVC for persistent data storage with CephFS
# Category: storage
# Resource Type: persistentvolumeclaim
# Tags: storage, pvc, cephfs
# Complexity: basic

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc-example
  namespace: gsoc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: rook-cephfs
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nrp-k8s-system"
version = "1.0.0"
description = "Intelligent NRP + Kubernetes routing and management system"
readme = "README.md"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Clustering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "kubernetes>=20.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "tldextract>=3.4.0",
    "pydantic>=2.0.0",
    "urllib3>=1.26.0",
    "langgraph>=0.1.0",
    "typing-extensions>=4.5.0",
]

[project.optional-dependencies]
analytics = [
    "numpy>=1.21.0",
    "scikit-learn>=1.1.0",
    "tabulate>=0.9.0",
]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/yourusername/nrp-k8s-system"
Documentation = "https://github.com/yourusername/nrp-k8s-system#readme"
Repository = "https://github.com/yourusername/nrp-k8s-system.git"
Issues = "https://github.com/yourusername/nrp-k8s-system/issues"

[project.scripts]
nrp-k8s = "nrp_k8s_system.cli:main"
intelligent-router = "nrp_k8s_system.intelligent_router:main"

[tool.setuptools]
packages = ["nrp_k8s_system", "nrp_k8s_system.core", "nrp_k8s_system.systems"]

[tool.setuptools.package-data]
nrp_k8s_system = ["config/*.json", "cache/.gitkeep"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
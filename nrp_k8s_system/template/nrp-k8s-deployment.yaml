---
# Resource: namespace
apiVersion: v1
kind: Namespace
metadata:
  name: gsoc
  labels:
    name: gsoc

---
# Resource: serviceaccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app-sa
  namespace: gsoc
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: nrp-k8s-builder

---
# Resource: deployment
# Generated with NRP K8s System - https://nrp.ai/documentation/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: gsoc
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: nrp-k8s-builder
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      serviceAccountName: demo-app-sa
      containers:
      - name: app
        image: nginx:latest
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
      restartPolicy: Always

---
# Resource: service
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: gsoc
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: nrp-k8s-builder
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo-app
  ports:
  - name: http
    port: 80
    targetPort: http

---
# Resource: ingress
# NRP Ingress: Use 'haproxy' ingress class for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  namespace: gsoc
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: nrp-k8s-builder
spec:
  ingressClassName: haproxy
  rules:
  - host: demo-app.nrp-nautilus.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: demo-app
            port:
              number: 80

---
# Resource: pdb
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-app-pdb
  namespace: gsoc
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: nrp-k8s-builder
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app